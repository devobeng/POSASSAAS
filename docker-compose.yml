version: '3.9'

services:
  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pos_dev
      POSTGRES_USER: pos_user
      POSTGRES_PASSWORD: pos_secret
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pos_user -d pos_dev']
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (optional — only needed if you set REDIS_URL in server env) ───────
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data

  # ── API server ──────────────────────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://pos_user:pos_secret@db:5432/pos_dev
      JWT_ACCESS_SECRET: change_me_in_production_32chars_min
      JWT_REFRESH_SECRET: change_me_in_production_32chars_min2
      CLIENT_URL: http://localhost:3000
      # Optional — set these to enable features:
      # REDIS_URL: redis://redis:6379
      # PAYSTACK_SECRET_KEY: sk_live_xxx
      # CLOUDINARY_CLOUD_NAME: mycloud
      # CLOUDINARY_API_KEY: xxx
      # CLOUDINARY_API_SECRET: xxx
    ports:
      - '5000:5000'
    healthcheck:
      test: ['CMD-SHELL', 'wget -qO- http://localhost:5000/healthz || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Next.js client ──────────────────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
    restart: unless-stopped
    depends_on:
      - server
    environment:
      NODE_ENV: production
    ports:
      - '3000:3000'

volumes:
  pg_data:
  redis_data:
